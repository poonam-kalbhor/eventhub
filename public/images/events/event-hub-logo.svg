<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 200" role="img" aria-label="Event Hub logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
#orbit{transform-box:view-box;transform-origin:100px 100px;animation:spin 20s linear infinite}
#spark{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@media (prefers-reduced-motion:reduce){#orbit,#spark{animation:none}}
</style>
<g id="mark">
<circle id="ring" cx="100" cy="100" r="78" fill="none" stroke="#E6DED3" stroke-width="2" stroke-dasharray="3 7" stroke-linecap="round"/>
<g id="orbit">
<circle id="dot-food" cx="100" cy="22" r="11" fill="#FF9A6B"/>
<circle id="dot-sport" cx="167.5" cy="61" r="11" fill="#5BA4FF"/>
<circle id="dot-tech" cx="167.5" cy="139" r="11" fill="#8B7BFF"/>
<circle id="dot-wellness" cx="100" cy="178" r="11" fill="#4CC38A"/>
<circle id="dot-art" cx="32.5" cy="139" r="11" fill="#FFC928"/>
<circle id="dot-music" cx="32.5" cy="61" r="11" fill="#FF6FAE"/>
</g>
<circle id="center" cx="100" cy="100" r="44" fill="#C93A17"/>
<path id="spark" fill="#fff" d="M100 74Q104.500 95.500 126 100Q104.500 104.500 100 126Q95.500 104.500 74 100Q95.500 95.500 100 74Z"/>
</g>
<text id="wordmark" x="226" y="124" font-family="'Space Grotesk','Inter',Arial,sans-serif" font-weight="700" font-size="76" letter-spacing="-2" fill="#1B1A17">Event <tspan id="wordmark-hub" fill="#C93A17">Hub</tspan></text>
</svg>
